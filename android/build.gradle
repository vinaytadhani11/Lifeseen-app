allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// Align Java and Kotlin on JVM 17 for every Android module.
// Plugin scripts (for example workmanager_android) set Kotlin to 1.8 during
// evaluation. Registering the override in afterEvaluate runs after that, so
// compileDebugJavaWithJavac and compileDebugKotlin stay on the same target.
subprojects { subproject ->
    subproject.afterEvaluate {
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions {
                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            }
        }

        if (subproject.plugins.hasPlugin("com.android.library") ||
            subproject.plugins.hasPlugin("com.android.application")) {
            subproject.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                // Set minimum compileSdk to 31 to support lStar attribute
                // Only override for libraries, not for app (which has compileSdk 36)
                if (subproject.plugins.hasPlugin("com.android.library")) {
                    def currentCompileSdk = compileSdk
                    if (currentCompileSdk == null) {
                        compileSdk = 31
                    } else {
                        def sdkVersion = currentCompileSdk.toString().toInteger()
                        if (sdkVersion < 31) {
                            compileSdk = 31
                        }
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
