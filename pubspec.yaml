name: tableflow_plus
description: "LifeSeen — WhatsApp insights and contact tracker"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.1.0
  lottie: ^3.3.3
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  in_app_review: ^2.0.10
  package_info_plus: ^8.3.0
  firebase_core: ^4.10.0
  firebase_database: ^12.1.3
  firebase_remote_config: ^6.2.0
  provider: ^6.1.5
  get: ^4.7.3
  shared_preferences: ^2.5.3
  device_info_plus: ^11.5.0
  crypto: ^3.0.6
  fl_chart: ^1.0.0
  phone_numbers_parser: ^9.0.3
  http: ^1.6.0
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.10.10
  timezone: ^0.11.2
  fluttertoast: 8.2.14
  image_picker: ^1.2.0
  firebase_storage: ^13.0.5
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/google_fonts/PlusJakartaSans-Regular.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/google_fonts/JetBrainsMono-Regular.ttf
  assets:
    - assets/
    - assets/user/
    - assets/json/
    - assets/icons/
    - assets/icons/3d/
    - assets/google_fonts/
